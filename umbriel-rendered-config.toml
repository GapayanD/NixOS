"Mod+Ctrl+WheelDown" = "window-focus-right"
"Mod+Ctrl+WheelUp" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Equal" = "window-modify-primary-extent 0.05"
"Mod+Escape" = "spawn noctalia msg panel-toggle session"
"Mod+I" = "spawn noctalia msg settings-toggle"
"Mod+J" = "window-focus-next"
"Mod+K" = "window-focus-previous"
"Mod+L" = "spawn noctalia msg session lock"
"Mod+Left" = "window-focus-left"
"Mod+Minus" = "window-modify-primary-extent -0.05"
"Mod+MouseMiddle" = "layout-scroll-drag"
"Mod+N" = "spawn noctalia msg notification-dnd-toggle"
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+Period" = "window-consume-right"
"Mod+Print" = "spawn noctalia msg screenshot-fullscreen"
"Mod+R" = "window-cycle-primary-extent"
"Mod+Right" = "window-focus-right"
"Mod+S" = "spawn noctalia msg panel-toggle control-center"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+E" = "session-quit"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+N" = "spawn noctalia msg nightlight-toggle"
"Mod+Shift+Page_Down" = "window-move-to-workspace-next"
"Mod+Shift+Page_Up" = "window-move-to-workspace-previous"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+Up" = "window-move-up"
"Mod+Space" = "spawn noctalia msg panel-toggle launcher"
"Mod+Up" = "window-focus-up"
"Mod+V" = "spawn noctalia msg panel-toggle clipboard"
"Mod+W" = "spawn noctalia msg panel-toggle ashur-d/wallpaper-widget:hub"
Print = "spawn noctalia msg screenshot-region"

[keybinds."Mod+B"]
action = "spawn zen"
repeat = false

[keybinds."Mod+C"]
action = "window-center"
repeat = false

[keybinds."Mod+Ctrl+M"]
action = "window-toggle-maximize-to-edges"
repeat = false

[keybinds."Mod+Ctrl+Space"]
action = "scratchpad-toggle terminal"
repeat = false

[keybinds."Mod+E"]
action = "spawn krusader"
repeat = false

[keybinds."Mod+F"]
action = "window-toggle-fullscreen"
repeat = false

[keybinds."Mod+Grave"]
action = "window-focus-last"
repeat = false

[keybinds."Mod+M"]
action = "window-toggle-maximize"
repeat = false

[keybinds."Mod+P"]
action = "window-toggle-pinned"
repeat = false

[keybinds."Mod+Q"]
action = "window-close"
repeat = false

[keybinds."Mod+Return"]
action = "spawn wezterm"
repeat = false

[keybinds."Mod+Shift+C"]
action = "config-reload"
repeat = false

[keybinds."Mod+Shift+Escape"]
action = "shortcuts-inhibit-toggle"
allow_when_inhibited = true
repeat = false

[keybinds."Mod+Shift+Q"]
action = "window-kill"
repeat = false

[keybinds."Mod+Shift+Space"]
action = "window-toggle-scratchpad terminal"
repeat = false

[keybinds."Mod+Shift+W"]
action = "column-toggle-tabbed"
repeat = false

[keybinds."Mod+Slash"]
action = "cheatsheet-toggle"
repeat = false

[keybinds."Mod+T"]
action = "window-toggle-floating"
repeat = false

[keybinds."Mod+Tab"]
action = "overview-toggle"
repeat = false

[keybinds."Mod+WheelDown"]
action = "workspace-next"
cooldown_ms = 150

[keybinds."Mod+WheelUp"]
action = "workspace-previous"
cooldown_ms = 150

[keybinds.XF86AudioLowerVolume]
action = "spawn noctalia msg volume-down"
allow_when_locked = true

[keybinds.XF86AudioMute]
action = "spawn noctalia msg volume-mute"
allow_when_locked = true
repeat = false

[keybinds.XF86AudioNext]
action = "spawn noctalia msg media next"
allow_when_locked = true

[keybinds.XF86AudioPlay]
action = "spawn noctalia msg media toggle"
allow_when_locked = true
repeat = false

[keybinds.XF86AudioPrev]
action = "spawn noctalia msg media previous"
allow_when_locked = true

[keybinds.XF86AudioRaiseVolume]
action = "spawn noctalia msg volume-up"
allow_when_locked = true

[keybinds.XF86MonBrightnessDown]
action = "spawn noctalia msg brightness-down"
allow_when_locked = true

[keybinds.XF86MonBrightnessUp]
action = "spawn noctalia msg brightness-up"
allow_when_locked = true

[[layer_rule]]
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[layer_rule.match]
namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"

[[layer_rule]]
blur_optimized = false

[layer_rule.match]
namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"

[layout]
extent_presets = [
    0.333,
    0.5,
    0.667,
]
gap = 5
mode = "scrolling"

[layout.scrolling]
default_extent_fraction = 0.5

[[scratchpad]]
name = "terminal"
proportional_size = true
spawn_when_empty = "wezterm start --class scratchpad-terminal"

[[window_rule]]
blur = true

[[window_rule]]
shadow = false

[window_rule.match]
is_floating = false

[[window_rule]]
default_floating = true

[window_rule.match]
app_id = [
    "^(org[.]pulseaudio[.])?pavucontrol$",
    "^blueman-manager$",
    "^qalculate-gtk$",
    "^(org[.]gnome[.]FileRoller|file-roller)$",
]

[[window_rule]]
default_floating = true

[window_rule.default_floating_size_px]
height = 900
width = 1020

[window_rule.match]
app_id = "^dev[.]noctalia[.]Noctalia$"

[[window_rule]]
default_floating = true

[window_rule.default_floating_size_px]
height = 600
width = 800

[window_rule.match]
app_id = "^dev[.]noctalia[.]UmbrielSharePicker$"

[[window_rule]]
default_floating = true
default_maximize = false

[window_rule.default_position]
anchor = "bottom_right"
x = 20
y = 20

[window_rule.match]
title = "^(Picture-in-Picture|Picture in picture)$"

[[window_rule]]
default_focused = false
default_pinned = true

[window_rule.default_position]
anchor = "bottom_right"
x = 0
y = 0

[window_rule.match]
title = "^notificationtoasts_.+_desktop"

[[window_rule]]
default_focused = true
default_scratchpad = "terminal"

[window_rule.default_floating_size]
height = 0.7
width = 0.7

[window_rule.match]
app_id = "^scratchpad-terminal$"
