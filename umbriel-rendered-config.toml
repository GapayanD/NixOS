# Rendered preview of ~/.config/umbriel/config.toml (reference only, not used by the build).
# Generated by evaluating home/umbriel against the Umbriel revision pinned in flake.lock (eb449f4).

[animation]
enabled = true

[animation.windows_in]
curve = "0.46,1.0,0.29,1.0"
duration_ms = 400
style = "slide"

[animation.windows_out]
curve = "0.08,0.92,0.0,1.0"
duration_ms = 800
style = "slide"

[appearance]
border_width = 1
corner_radius = 6
prefer_no_csd = true

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 5

[appearance.shadow]
enabled = true
offset_x = 0
offset_y = 0
softness = 15

[colors]
accent_primary = "#C9B890FF"

[colors.border]
focused = "#C9B890FF"
unfocused = "#3A3A3AFF"

[colors.overview]
badge = "#C9B890FF"

[colors.tab_bar]
active = "#C9B890FF"
active_text = "#141419FF"

[general]
autostart = [
    "noctalia",
]
show_cheatsheet = false

[input.cursor]
size = 24
theme = "Bibata-Modern-Classic"

[input.keyboard]
layout = "us"
numlock_toggle = true
repeat_delay = 600
repeat_rate = 25

[input.mouse]
natural_scroll = false

[input.touchpad]
disable_while_typing = true
natural_scroll = false
tap = true

[keybinds]
"Alt+Shift+Tab" = "spawn noctalia msg window-switcher hold reverse"
"Alt+Tab" = "spawn noctalia msg window-switcher hold"
"Ctrl+Alt+N" = "workspace-set-layout toggle scrolling dwindle master"
Mod = "spawn noctalia msg panel-toggle launcher"
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+Alt+Left" = "output-focus-left"
"Mod+Alt+N" = "spawn noctalia msg panel-toggle noctalia/umbriel-companion:panel"
"Mod+Alt+Right" = "output-focus-right"
